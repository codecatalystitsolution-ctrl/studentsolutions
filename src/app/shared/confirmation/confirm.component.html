<div class="confirm-overlay" *ngIf="state().open">
  <div class="confirm-card glass-card">
    <div class="confirm-header">
      <h2>{{ state().title }}</h2>
      <button type="button" class="close-btn" (click)="cancel()">✕</button>
    </div>
    <p class="confirm-message">{{ state().message }}</p>
    <div class="confirm-actions">
      <button type="button" class="btn-cancel" (click)="cancel()">{{ state().cancelText }}</button>
      <button type="button" class="btn-confirm" (click)="accept()">{{ state().confirmText }}</button>
    </div>
  </div>
</div>
